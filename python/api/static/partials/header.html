<header class="topbar" id="overview">
    <div class="topbar-heading">
        <div class="eyebrow">T2CHCORE / HOME SYSTEM</div>

        <h1>Kontrol Merkezi</h1>

        <p class="topbar-description">
            Akıllı ev cihazlarını ve sistem durumunu tek noktadan yönet.
        </p>
    </div>

    <div class="topbar-actions">
        <div class="connection-pill">
            <span
                class="status-dot"
                id="header-health-dot"
                aria-hidden="true"
            ></span>

            <span id="header-health-text">
                Bağlantı kontrol ediliyor
            </span>
        </div>

        <button
            class="button"
            id="refresh-button"
            type="button"
            aria-label="Dashboard verilerini yenile"
        >
            <span aria-hidden="true">↻</span>
            Yenile
        </button>
    </div>
</header>
