<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="T2chCore Home System — yerel akıllı ev kontrol paneli."
    >
    <meta name="theme-color" content="#0b1120">

    <title>T2chCore Home System</title>

    <link rel="icon" type="image/png" href="/static/logo.png">
    <link rel="apple-touch-icon" href="/static/logo.png">
    <link rel="stylesheet" href="/static/css/style.css">

    <script type="module" src="/static/js/app.js"></script>
</head>

<body>
    <div class="app-shell">
        <div id="sidebar-slot">
            <aside class="sidebar" aria-label="Ana navigasyon">
                <div class="brand">
                    <img
                        class="brand-logo"
                        src="/static/logo.png"
                        alt="T2chCore Home System logosu"
                    >
                    <div class="brand-copy">
                        <span class="brand-title">T2chCore</span>
                        <span class="brand-subtitle">HOME SYSTEM</span>
                    </div>
                </div>

                <p class="sidebar-label">MENÜ</p>
                <p class="sidebar-status-text">Arayüz yükleniyor...</p>
            </aside>
        </div>

        <main class="main-content">
            <div id="header-slot">
                <header class="topbar">
                    <div class="topbar-heading">
                        <h1>Kontrol Merkezi</h1>
                        <p>Akıllı ev sistemin yükleniyor...</p>
                    </div>
                </header>
            </div>

            <div
                id="notice"
                class="notice"
                role="status"
                aria-live="polite"
                hidden
            ></div>

            <div id="overview-slot">
                <section class="content-section">
                    <div class="panel empty-state">
                        Dashboard yükleniyor...
                    </div>
                </section>
            </div>

            <div id="device-form-slot"></div>
            <div id="assistant-slot"></div>
            <div id="footer-slot"></div>
        </main>
    </div>
</body>
</html>
